name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查、测试与数据检查
        run: |
          npm run typecheck
          npm test
          npm run validate-data

      - id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 静态构建
        env:
          PHONELENS_TARGET: static
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # 可选：独立后端地址（只放公开地址，不放密钥）。未设置时 AI 功能显示“暂未启用”。
          NEXT_PUBLIC_API_BASE: ${{ vars.PHONELENS_API_BASE }}
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
